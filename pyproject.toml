[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "termuxagent0"
version = "0.1.0"
description = "AI agent with shell and file tools that runs in Termux (stdlib only)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "sachintha82288-cpu" }]
keywords = ["termux", "agent", "llm", "cli", "ai", "openai", "groq", "ollama"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Terminals",
]
dependencies = []

[project.scripts]
termuxagent = "termuxagent.__main__:main"

[tool.setuptools]
packages = ["termuxagent"]
